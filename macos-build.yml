name: macOS App Auto-Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from the GitHub web UI

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest

    steps:
      # 1. Checkout the source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install XcodeGen using Homebrew
      - name: Install XcodeGen
        run: |
          brew install xcodegen

      # 3. Generate the Xcode Project (.xcodeproj)
      - name: Generate Xcode Project
        run: |
          xcodegen generate

      # 4. Build and Archive the SwiftUI App
      - name: Build and Archive
        run: |
          xcodebuild -project Mongolmic.xcodeproj \
                     -scheme Mongolmic \
                     -configuration Release \
                     -archivePath Mongolmic.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO

      # 5. Extract the compiled .app from the Archive
      - name: Prepare Application Bundle
        run: |
          mkdir -p build_output
          cp -R Mongolmic.xcarchive/Products/Applications/Mongolmic.app build_output/
          
          # Compress the app into a ZIP file for easy download
          cd build_output
          zip -r Mongolmic_macOS.zip Mongolmic.app

      # 6. Upload the compiled ZIP as a GitHub Artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mongolmic-macOS-Executable
          path: build_output/Mongolmic_macOS.zip
          if-no-files-found: error
